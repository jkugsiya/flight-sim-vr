<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Island Flyer</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='6' fill='%231c2529'/%3E%3Cpath d='M16 4l2 10 10 5v3l-10-2-1 6 3 2v2l-4-1-4 1v-2l3-2-1-6-10 2v-3l10-5z' fill='%23efe9d6'/%3E%3C/svg%3E"
    />
    <style>
      /* Shown while the islands are generated, before the game takes over the page */
      #splash {
        position: fixed;
        inset: 0;
        display: grid;
        place-items: center;
        background: #2b3437;
        font-family: 'DIN Alternate', 'Bahnschrift', 'Avenir Next Condensed', 'Roboto Condensed', 'Arial Narrow',
          system-ui, sans-serif;
      }
      #splash > div {
        width: min(26rem, 80vw);
        padding: 2rem 2.25rem;
        border-radius: 6px;
        background: #efe9d6;
        color: #1c2529;
        box-shadow: 0 24px 48px rgb(0 0 0 / 0.45);
      }
      #splash h1 {
        margin: 0;
        font-size: 2.25rem;
        line-height: 1;
      }
      #splash p {
        margin: 0.75rem 0 1.25rem;
        font-size: 1.05rem;
      }
      #splash i {
        display: block;
        height: 6px;
        border-radius: 3px;
        background: linear-gradient(90deg, #1c2529 40%, #1c252933 0) 0 0 / 250% 100%;
        animation: splash 1.4s linear infinite;
      }
      @keyframes splash {
        from {
          background-position: 100% 0;
        }
        to {
          background-position: -66% 0;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #splash i {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="splash">
        <div>
          <h1>Island Flyer</h1>
          <p>Building nine islands, twelve airports, and 90,000 trees.</p>
          <i></i>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
